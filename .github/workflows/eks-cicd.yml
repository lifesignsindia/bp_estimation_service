name: EKS CICD Workflow

on:
  push:
    branches: [onprem-prod]

permissions:
  id-token: write
  contents: read
  packages: read  

env:
  APP_NAME: bp-detection-service
  ECR_REPO: onprem-prod-bp-detection-service
  MANIFEST_PATH: ls-nexus-onprem-prod/bp-detection-service/deployment.yaml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Production AWS Credentials
        if: github.ref == 'refs/heads/onprem-prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::100403449615:role/${{ env.APP_NAME }}-onprem-prod-github-actions-cicd-role
          role-session-name: GitHub_To_AWS_From_onprem_${{ env.APP_NAME }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-${{ env.sha_short }}')" >> $GITHUB_ENV

      - name: Build Project for EKS Prod
        if: github.ref == 'refs/heads/onprem-prod'
        run: |
          docker build -t ${{ env.ECR_REPO }} .

      - name: Tag, and push image to Prod Amazon ECR..
        if: github.ref == 'refs/heads/onprem-prod'
        run: |
          docker tag ${{ env.ECR_REPO }}:latest ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.date }}
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.date }}

      - uses: actions/checkout@v3
        with:
          repository: lifesignsindia/eks-apps-configs
          ref: main
          path: cicd-repo
          token: ${{ secrets.CI_CD_TOKEN }}

      - name: Change Prod Yaml
        if: github.ref == 'refs/heads/onprem-prod'
        shell: bash
        env:
          FILEPATH: ${{ env.MANIFEST_PATH }}
          YAMLPATH: .spec.template.spec.containers[0].image
          NEWVALUE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ env.date }}
        run: |
          yq -i "${YAMLPATH} = \"${NEWVALUE}\"" cicd-repo/${FILEPATH}

      - name: Commit and Push Prod Changes
        if: github.ref == 'refs/heads/onprem-prod'
        working-directory: cicd-repo
        shell: bash
        env:
          COMMITPREFIX: 'GitHub-Action - '
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add ${{ env.MANIFEST_PATH }} || {
            echo "No files were changed, so we did not commit anything"
            exit 1
          } && \
          git commit -m "$COMMITPREFIX Automated changes to ${{ env.MANIFEST_PATH }}" && \
          git push origin main
          
      - run: ls -la cicd-repo
        shell: bash
      - run: rm -rf cicd-repo
        shell: bash

  pd_alert:
    name: PD ALERT
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: check build result
        run: |
          echo "Build result: ${{ needs.build.result }}"
      - name: Trigger PD on failure
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "${BUILD_RESULT}" != "failure" ]; then
            echo "Not a failure, skipping"
            exit 0
          fi

          if [ -z "${PAGERDUTY_ROUTING_KEY}" ]; then
            echo "ERROR: No routing key"
            exit 1
          fi


          # send to PagerDuty
          curl -sS -X POST "https://events.pagerduty.com/v2/enqueue" \
            -H "Content-Type: application/json" \
            -d '{
              "routing_key": "'"${PAGERDUTY_ROUTING_KEY}"'",
              "event_action": "trigger",
              "payload": {
                "summary": "Build failed: ${{ github.repository }} – workflow ${{ github.workflow }} run ${{ github.run_number }} (run ID ${{ github.run_id }})",
                "severity": "error",
                "source": "${{ github.repository }}",
                "component": "GitHub Actions Workflow",
                "group": "CI/CD",
                "class": "build failure",
                "custom_details": {
                  "workflow": "${{ github.workflow }}",
                  "run_number": "${{ github.run_number }}",
                  "run_id": "${{ github.run_id }}",
                  "branch": "${{ github.ref }}",
                  "actor": "${{ github.actor }}",
                  "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }
            }' \
            -w "\nHTTP_STATUS:%{http_code}\n" -o /tmp/pd_resp.txt

          cat /tmp/pd_resp.txt
